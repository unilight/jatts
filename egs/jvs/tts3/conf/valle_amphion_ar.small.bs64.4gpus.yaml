###########################################################
#                FEATURE EXTRACTION SETTING               #
###########################################################
sampling_rate: 24000     # Sampling rate.
fft_size: 2048           # FFT size.
hop_size: 300            # Hop size.
win_length: null         # Window length.
                         # If set to null, it will be the same as fft_size.
window: "hann"           # Window function.
num_mels: 80             # Number of mel basis.
fmin: 80                 # Minimum freq in mel basis calculation.
fmax: 7600               # Maximum frequency in mel basis calculation.
global_gain_scale: 1.0   # Will be multiplied to all of waveform.

feat_list: ["encodec_24khz"]
prompt_feat_list: ["encodec_24khz"]
out_feat_type: encodec_24khz
prompt_strategy: "given"  # one of: same, given

###########################################################
#              NETWORK ARCHITECTURE SETTING               #
###########################################################
model_type: VALLE_AMPHION_AR
model_params:
    target_vocab_size: 1024
    hidden_size: 768
    intermediate_size: 3072
    num_hidden_layers: 12
    num_attention_heads: 8

###########################################################
#                      LOSS SETTING                       #
###########################################################
trainer_type: VALLE_AMPHION_ARTrainer
collater_type: VALLECollater

###########################################################
#                   INFERENCE SETTING                     #
###########################################################
vocoder:
    vocoder_type: encodec_24khz
max_ar_steps: 1000

###########################################################
#                  DATA LOADER SETTING                    #
###########################################################
batch_size: 4                   # Batch size.
pin_memory: true                # Whether to pin memory in Pytorch DataLoader.
num_workers: 2                  # Number of workers in Pytorch DataLoader.
allow_cache: true               # Whether to allow cache in dataset. If true, it requires cpu memory.
gradient_accumulate_steps: 4    # Number of forward steps before a backward step. Used when OOM happens.
                                # 4 GPUs, 4 * 4 * 8 = 128

###########################################################
#             OPTIMIZER & SCHEDULER SETTING               #
###########################################################
optimizer_type: AdamW
optimizer_params:
    lr: 0.0001
grad_norm: 1.0              # Gradient norm.
scheduler_type: WarmupExponentialLR
scheduler_params:
    warmup_steps: 25000
    gamma: 0.999999

###########################################################
#                    INTERVAL SETTING                     #
###########################################################
train_max_steps: 800000     # Number of training steps.
save_interval_steps: 1000   # Interval steps to save checkpoint.
eval_interval_steps: 100    # Interval steps to evaluate the network.
log_interval_steps: 10      # Interval steps to record the training log.

###########################################################
#                     OTHER SETTING                       #
###########################################################
num_save_intermediate_results: 4  # Number of results to be saved as intermediate results.
